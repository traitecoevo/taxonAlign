# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples, in the same form as
# APCalign's. Builds the site on every pull request (to catch breakage) and deploys it to the
# gh-pages branch, served by GitHub Pages, on a push to main or a release.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      # the articles are Quarto documents
      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # the quarto R package too, not just the CLI installed above: pkgdown reads .qmd articles with it
          extra-packages: any::pkgdown, any::quarto, local::.
          needs: website

      # pkgdown publishes every top-level .md file and can't be told to skip one; CLAUDE.md is
      # internal development notes, so it's removed from this throwaway checkout first
      - name: Leave internal notes out of the site
        run: rm -f CLAUDE.md
        shell: bash

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs
